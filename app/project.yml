name: Whisky
options:
  bundleIdPrefix: com.chung
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    DEVELOPMENT_TEAM: 52A8DH7GF9
    # A stable Developer ID signature keeps the Accessibility grant across rebuilds; an ad-hoc
    # signature changes with every build and macOS silently drops the grant.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    DEAD_CODE_STRIPPING: YES

packages:
  WhiskyCore:
    path: Packages/WhiskyCore

targets:
  Whisky:
    type: application
    platform: macOS
    sources:
      - path: Whisky
    dependencies:
      - package: WhiskyCore
    info:
      path: Whisky/Info.plist
      properties:
        CFBundleDisplayName: Whisky
        CFBundleName: Whisky
        CFBundleShortVersionString: "0.6.0"
        CFBundleVersion: "6"
        CFBundleDevelopmentRegion: zh-Hant
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Whisky：給瀏海 Mac 的選單列工具"
        CFBundleURLTypes:
          - CFBundleURLName: com.chung.whisky
            CFBundleURLSchemes: [whisky]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chung.whisky
        PRODUCT_NAME: Whisky
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
